<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open clip on Himmin</title>
    <meta name="description" content="Open this Himmin clip in the app." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://www.himmin.com/clip" />

    <meta property="og:title" content="Open this Himmin clip" />
    <meta property="og:description" content="Continue to this clip in the Himmin app." />
    <meta property="og:type" content="video.other" />
    <meta property="og:url" content="https://www.himmin.com/clip" />
    <meta property="og:image" content="https://www.himmin.com/src/images/new_logo.jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:site_name" content="Himmin" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open this Himmin clip" />
    <meta name="twitter:description" content="Continue to this clip in the Himmin app." />
    <meta name="twitter:image" content="https://www.himmin.com/src/images/new_logo.jpeg" />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #050505;
        --surface: #121214;
        --surface-strong: #18181b;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f7f7f8;
        --muted: #b8bac2;
        --muted-strong: #d8d9de;
        --red: #bf0a30;
        --red-dark: #930722;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, rgba(191, 10, 48, 0.12) 0%, rgba(5, 5, 5, 0) 36%),
          var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 22px 0;
      }

      .brand-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-link img {
        width: 40px;
        height: 40px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 0 0 2px rgba(191, 10, 48, 0.34);
      }

      .content {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 52px;
        align-items: center;
        padding: 54px 0 84px;
      }

      .copy {
        max-width: 620px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--red);
        font-size: 0.86rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: 2.9rem;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .summary {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.75;
        max-width: 560px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 34px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 13px 22px;
        border-radius: 999px;
        font-weight: 800;
        transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      }

      .button-primary {
        background: var(--red);
        color: #ffffff;
        border: 1px solid var(--red);
        box-shadow: 0 18px 45px rgba(191, 10, 48, 0.28);
      }

      .button-secondary {
        color: var(--muted-strong);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button-primary:hover {
        background: var(--red-dark);
        border-color: var(--red-dark);
      }

      .button-secondary:hover {
        border-color: rgba(255, 255, 255, 0.24);
      }

      .status {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.6;
      }

      .clip-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)),
          var(--surface);
        padding: 26px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
      }

      .clip-media {
        aspect-ratio: 9 / 16;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 22%, rgba(191, 10, 48, 0.32), rgba(191, 10, 48, 0) 38%),
          var(--surface-strong);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .clip-media img {
        width: min(46%, 150px);
        height: auto;
        display: block;
        border-radius: 28px;
      }

      .clip-label {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .clip-value {
        margin: 6px 0 0;
        color: var(--text);
        font-size: 1.28rem;
        font-weight: 800;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
          gap: 34px;
          padding-top: 34px;
        }

        h1 {
          font-size: 2.25rem;
        }

        .summary {
          font-size: 1rem;
        }

        .clip-panel {
          order: -1;
          max-width: 360px;
        }
      }

      @media (max-width: 520px) {
        .topbar,
        .content {
          width: min(100% - 28px, 1120px);
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand-link" href="/" aria-label="Himmin home">
          <img src="/src/images/logo.png" alt="" />
          <span>Himmin</span>
        </a>
      </header>

      <section class="content" aria-labelledby="page-title">
        <div class="copy">
          <p class="eyebrow">Clip link</p>
          <h1 id="page-title">Opening Himmin</h1>
          <p class="summary" id="clip-summary">Continue to this clip in the Himmin app.</p>

          <div class="actions">
            <a class="button button-primary" id="open-app" href="https://play.google.com/store/apps/details?id=com.supergram&amp;hl=en_IN">Open in Himmin</a>
            <a class="button button-secondary" id="install-app" href="https://play.google.com/store/apps/details?id=com.supergram&amp;hl=en_IN" target="_blank" rel="noopener noreferrer">Get the app</a>
          </div>

          <p class="status" id="open-status">If Himmin is installed, this clip link can open directly in the app.</p>
        </div>

        <aside class="clip-panel" aria-label="Shared Himmin clip">
          <div class="clip-media">
            <img src="/src/images/logo.png" alt="Himmin" />
          </div>
          <p class="clip-label">Shared clip</p>
          <p class="clip-value" id="clip-value">Himmin</p>
        </aside>
      </section>
    </main>

    <script>
      (function () {
        const packageName = 'com.supergram';
        const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.supergram&hl=en_IN';
        const params = new URLSearchParams(window.location.search);
        const rawClipId = (params.get('c') || '').trim().slice(0, 160);
        const hasClip = rawClipId.length > 0;
        const encodedClipId = encodeURIComponent(rawClipId);
        const pathAndQuery = hasClip
          ? `reels?clipId=${encodedClipId}&fetchClips=true&isFullScreen=true`
          : 'reels';
        const intentUrl = `intent://${pathAndQuery}#Intent;scheme=supergram;package=${packageName};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
        const isAndroid = /Android/i.test(navigator.userAgent);

        const title = document.getElementById('page-title');
        const summary = document.getElementById('clip-summary');
        const clipValue = document.getElementById('clip-value');
        const openApp = document.getElementById('open-app');
        const installApp = document.getElementById('install-app');
        const status = document.getElementById('open-status');

        openApp.href = isAndroid ? intentUrl : playStoreUrl;
        installApp.href = playStoreUrl;

        if (hasClip) {
          document.title = 'Watch this clip on Himmin';
          title.textContent = 'Open this clip on Himmin';
          summary.textContent = 'Continue to this clip in the Himmin app.';
          clipValue.textContent = rawClipId;
          status.textContent = isAndroid
            ? 'Opening the app now. Use the button if the browser stays here.'
            : 'Open this link on Android to continue in the Himmin app.';
        } else {
          status.textContent = isAndroid
            ? 'Opening the app now. Use the button if the browser stays here.'
            : 'Open this link on Android to continue in the Himmin app.';
        }

        if (isAndroid) {
          window.setTimeout(function () {
            if (!document.hidden) {
              window.location.href = intentUrl;
            }
          }, 650);
        }
      })();
    </script>
  </body>
</html>
